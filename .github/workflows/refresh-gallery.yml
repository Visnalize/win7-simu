name: Refresh theme gallery

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: theme-gallery

jobs:
  refresh:
    name: Rebuild the snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the databases
        id: snapshot
        run: node .github/scripts/refresh-gallery.mjs

      - name: Commit the snapshots
        if: steps.snapshot.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themestudio
          git commit -m "chore: refresh theme gallery"
          git push

      - name: Purge the CDN cache
        # jsDelivr caches a branch for 12 hours, longer than the 6 between runs
        if: steps.snapshot.outputs.files != ''
        env:
          FILES: ${{ steps.snapshot.outputs.files }}
        run: |
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            curl --fail --silent --show-error "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$file"
            echo
          done <<< "$FILES"
